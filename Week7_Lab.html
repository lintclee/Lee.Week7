<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Element Selector</title>
    
</head>
<body>

    <button id="Pick_Play_Button">Bass </button>
    <div id="result">Click the button to start!</div>

    <button id = "Pick_Play2">Cowbell</button>
    <div id="result2">Click the button to start!</div>

    <button id = "Pick_Play3">Augmented</button>
    <div id = "result3">Click the button to start!</div>

    <script>
            
             const myCtx = new AudioContext();

        const waveArray = ["sine", "sawtooth", "square", "triangle"]
        const randomWave = function() {
            let randWaveform = waveArray[Math.floor(Math.random() * waveArray.length)];
            return randWaveform;
        }
            
            function playNote(someContext, frequency, duration)
        {
            const osc1 = new OscillatorNode(someContext);
            const osc2 = new OscillatorNode(someContext);
            const osc3 = new OscillatorNode(someContext);
            const gain = new GainNode(someContext);
        
            
            osc1.frequency.value = frequency;
            osc2.frequency.value = frequency*1.999;
            osc3.frequency.value = frequency*2.01;
            osc1.type = randomWave();
            osc2.type = randomWave();
            osc3.type = randomWave();
            gain.gain.value = 0.001;

            osc1.connect(gain).connect(someContext.destination);
            osc2.connect(gain).connect(someContext.destination);
            osc3.connect(gain).connect(someContext.destination);

            let now = someContext.currentTime;

            gain.gain.exponentialRampToValueAtTime(0.6, now + duration*0.01); //attack
            gain.gain.exponentialRampToValueAtTime(0.2, now + duration*0.1);
            gain.gain.linearRampToValueAtTime(0, now + duration); //release

            osc1.start();
            osc1.stop(now + duration);

            osc2.start();
            osc2.stop(now + duration);

            osc3.start();
            osc3.stop(now + duration);

        }

        function playnote2(someContext, frequency, duration)
        {
            const osc1 = new OscillatorNode(someContext);
            const osc2 = new OscillatorNode(someContext);
            const osc3 = new OscillatorNode(someContext);

            const gain = new GainNode(someContext);
            osc1.connect(gain).connect(someContext.destination);
            osc2.connect(gain).connect(someContext.destination);
            osc3.connect(gain).connect(someContext.destination);
            osc1.frequency.value = frequency;
            osc2.frequency.value = frequency*1.34;
            osc3.frequency.value = frequency*1.33;
            osc1.type = "square";
            osc2.type = "triangle";
            osc3.type = randomWave();

            let now = someContext.currentTime;
           gain.gain.value = 0.001;

            gain.gain.exponentialRampToValueAtTime(0.45, now + 0.005);
            gain.gain.exponentialRampToValueAtTime(0.05, now + 0.04);
            gain.gain.linearRampToValueAtTime(0, now + duration);

            osc1.start();
            osc1.stop(now+duration);

            osc2.start();
            osc2.stop(now+duration);

            osc3.start();
            osc3.stop(now+duration);


        }

        function playnote3(someContext, frequency, duration) {
        const osc1 = new OscillatorNode(someContext);
        const osc2 = new OscillatorNode(someContext);
        const osc3 = new OscillatorNode(someContext);
        const gain = new GainNode(someContext);
        osc1.connect(gain).connect(someContext.destination);
        osc2.connect(gain).connect(someContext.destination);
        osc3.connect(gain).connect(someContext.destination);

        osc1.frequency.value = frequency;
        osc2.frequency.value = frequency*2.5;
        osc3.frequency.value = frequency*1.004;

        osc1.type = "triangle";
        osc2.type = randomWave();
        osc3.type = "triangle";

        let now = someContext.currentTime;
         gain.gain.value = 0.001;

            gain.gain.exponentialRampToValueAtTime(0.7, now + duration*0.2);
            gain.gain.exponentialRampToValueAtTime(0.2, now + duration*0.6);
            gain.gain.linearRampToValueAtTime(0, now + duration);

        osc1.start();
        osc1.stop(now+duration);

        osc2.start();
        osc2.stop(now+duration);

        osc3.start();
        osc3.stop(now+duration);
        }
        
        // 1. Define the array of choices
        const midiPitches = [30, 31, 34, 35, 37, 38, 41, 42];

        // 2. Create the random picker function
        const randomPitch = function() {
            let randomMidiNote = midiPitches[Math.floor(Math.random() * midiPitches.length)];
            
            let newFreq = 440 * 2 ** ((randomMidiNote - 69) / 12);

            return newFreq;
        }
        //random durs

        const durArray = [0.125, 0.25, 0.5, 0.75, 1, 1.5]
        const randomDuration = function() {
            let randNoteLength = durArray[Math.floor(Math.random() * durArray.length)];
            return randNoteLength;
        }
        
        const durArray2 = [0.5, 0.75, 1, 1.5, 2]
        const randomDuration2 = function() {
            let randNoteLength = durArray2[Math.floor(Math.random() * durArray2.length)];
            return randNoteLength;
        }



        const midiPitches2 = [60, 62, 63, 65, 66, 68, 69, 71, 72];
        const randomPitch2 =function() {
            let randomMidiNote = midiPitches2[Math.floor(Math.random() * midiPitches2.length)];
            let newFreq = 440 * 2 **((randomMidiNote - 69)/12);
            return newFreq;
        }
        const midiPitches3 = [48, 52, 56, 60, 64, 68, 72, 76, 80]
        const randomPitch3 = function() {
            let randomMidiNote = midiPitches3[Math.floor(Math.random()* midiPitches3.length)];
            let newFreq = 440 * 2 **((randomMidiNote - 69)/12);
            return newFreq;
        }
        // 3. Set up references to the HTML elements
        const button = document.getElementById("Pick_Play_Button");
        const resultDisplay = document.getElementById("result");



        // 4. Trigger the function on click and print the result
        button.addEventListener("click", function() {
            const randomChoice = randomPitch(midiPitches);
            resultDisplay.textContent = randomChoice;

            document.querySelector("#Pick_Play_Button").onclick = () => playNote(myCtx, randomPitch(), 0.8);
        });

        const button2 = document.getElementById("Pick_Play2");
        const resultDisplay2 = document.getElementById("result2");

        button2.addEventListener("click", function() {
            const randomChoice = randomPitch2(midiPitches2);
            resultDisplay2.textContent = randomChoice;
            document.querySelector("#Pick_Play2").onclick = () => playnote2(myCtx, randomPitch2(), randomDuration())

        });

        const button3 = document.getElementById("Pick_Play3");
        const resultDisplay3 = document.getElementById("result3");

        button3.addEventListener("click", function() {
            const randomChoice = randomPitch3(midiPitches3);
            resultDisplay3.textContent = randomChoice;
            document.querySelector("#Pick_Play3").onclick = () => playnote3(myCtx, randomPitch3(), randomDuration2())
        });

    </script>

</body>
</html>
