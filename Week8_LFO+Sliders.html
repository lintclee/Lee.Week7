<!DOCTYPE html>
<html lang = "en">
    <head>
        <meta charset = "UTF-8">
        <title> LmFaO </title>
    </head>
    <body>
<input id = "LFOAmt" type = "range" min = "20" max = "200" step = "2" value = "1"><label id = "Cutoff_Display">Cutoff_Range</label>
<input id = "LFOSpeed" type = "range" min = "0.125" max = "10" step = "0.0001" value = 0.3><label id = "Rate_Display">Rate_Range</label>
<script>
    
    const ctx = new AudioContext();

    const Osc1 = new OscillatorNode(ctx);
    Osc1.type = "sawtooth";
    Osc1.frequency.value = 110;

    const LPFilter = new BiquadFilterNode(ctx);
    LPFilter.type = "lowpass";
    LPFilter.frequency = "1050";
    LPFilter.Q = 4;

    const LFO = new OscillatorNode(ctx);
    LFO.type = "sine";
    LFO.frequency.value = 4;

    const LFODepth = new GainNode(ctx);
    LFODepth.gain.setValueAtTime(50, ctx.currentTime); //Modulates the cutoff by +-50

    LFO.connect(LFODepth);
    LFODepth.connect(LPFilter.frequency);

    Osc1.connect(LPFilter);
    LPFilter.connect(ctx.destination);

    Osc1.start();
    LFO.start();

    const slider1 = document.querySelector("#LFOAmt")
    slider1.addEventListener("input", ()=> {
        ctx.resume();
        LFODepth.gain.value = Number(slider1.value);
        document.querySelector("#Cutoff_Display").textContent = slider1.value;

    });

    const slider2 = document.querySelector("#LFOSpeed")
    slider2.addEventListener("input", ()=> {
        ctx.resume();
        LFO.frequency.value = (Number(slider2.value));
        document.querySelector("#Rate_Display").textContent = slider2.value;
    });


</script>
    </body>
</html>
